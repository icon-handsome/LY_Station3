[App]
version=0.1.0
environment=production

[Logger]
level=1
; rotateDays 为保留项，程序不会删除历史日志；每次启动独立文件：
;   logs/scan_tracking_yyyy-MM-dd_HHmmss_zzz.txt
;   logs/algorithm_scan_tracking_yyyy-MM-dd_HHmmss_zzz.txt（各路径算法日志统一写入）
rotateDays=0

[Modbus]
host=0.0.0.0
port=501
unitId=1
timeoutMs=1000
reconnectIntervalMs=2000

[Camera]
defaultCamera=192.168.8.203
scanTimeoutMs=5000

[Station]
; 第三工位 IPC 骨架
stationId=3
stationName=第三工位
scanPathsConfigPath=config/scan_paths/station3_placeholder.json
defaultWorkMode=MODE_STATION3
profileIni=config/station_profiles/station3_default.ini

[Vision]
mechEyeCameraKey=192.168.8.203
mechCaptureTimeoutMs=30000
mechDepthRangeMin=100
mechDepthRangeMax=2000
hikConnectTimeoutMs=3000
hikCaptureTimeoutMs=1000
; 海康双目 A/B 曝光（微秒），连接相机时写入 SDK
hikExposureTimeUs=50000
hikGain=0
hikSdkRoot=third_party/MVS
; 以下 GigE 双目 A/B 已废弃，由 hikCxpCameraA/B 替代（主流程不再启动）
;hikCameraAName=hik_camera_a
;hikCameraAKey=192.168.8.12
;hikCameraAIp=192.168.8.12
;hikCameraASerial=
;hikCameraBName=hik_camera_b
;hikCameraBKey=192.168.8.22
;hikCameraBIp=192.168.8.22
;hikCameraBSerial=
hikCameraCName=hik_camera_c
hikCameraCKey=192.168.8.100
hikCameraCIp=192.168.8.100
hikCameraCSerial=
; 海康 C 不走 SDK，以下 accessMode 仅保留配置项，程序不读取
hikCameraCAccessMode=monitor
hikCameraCTcpListenIp=192.168.8.15
hikCameraCTcpListenPort=8999
hikCameraCFtpDirectory=D:/HikCameraFTP/telescopic
; 伸缩杆组 Mech + 海康 C（按第三工位现场配置）
mechEyeTelescopicKey=192.168.8.203
hikCameraCTelescopicIp=192.168.8.204
hikCameraCTelescopicFtpDirectory=D:/HikCameraFTP/telescopic
; 机械臂组 Mech + 海康 C（按第三工位现场配置）
mechEyeArmKey=192.168.8.208
hikCameraCArmIp=192.168.8.9
hikCameraCArmFtpDirectory=D:/HikCameraFTP/arm

; CH250 CoaXPress（PCIe 采集卡）双目 — 机械臂扫描 LB 位姿需要
hikCxpEnabled=true
; true：路径/自检正常进入；仅不采 CXP、不因 CXP 失败阻断（CXP 另作他用时开）
hikCxpBypassOk=true
hikCxpCaptureTimeoutMs=5000
hikCxpExposureTimeUs=50000
hikCxpGain=0
hikCxpSmokeOutputDir=D:/CxpSmokeTest
; 立体约定：A=右目(I2)，B=左目(I1)。LB 入参必须 B 左、A 右，不可按字母序对调。
hikCxpCameraAName=ch250_a
hikCxpCameraAKey=DA9122996
hikCxpCameraASerial=DA9122996
hikCxpCameraBName=ch250_b
hikCxpCameraBKey=DA6578689
hikCxpCameraBSerial=DA6578689

[FlowControl]
pollIntervalMs=500
heartbeatIntervalMs=1000
simulatedProcessingMs=300
; 扫描失败清理：segment=仅剔本段；path=清当前路径缓存；workpiece=整表清零（对齐工位1）
scanFailurePolicy=segment
; false：跳过厚度/容积/焊缝等全部算法解算，检测直接 OK，只跑采集主流程（联调/避崩溃时用）
algorithmEnabled=false

[Tracking]
; scanSegmentTotal 供 Modbus 日志/占位；有 scan_paths 时以活跃路径配额为准（path1=臂12+伸缩杆7）
scanSegmentTotal=19

[LbPose]
trackConfigFile=third_party/LB/track_config.ini
templateFile=third_party/LB/S2_Scanner_Template_20260717.txt
dataRoot=data/LB
angleToleranceDeg=2.0
lengthTolerance=0.5
minPercent=0.5

[OrbbecGemini]
orbbecGeminiEnabled=false
orbbecGeminiSdkRoot=C:/Program Files/OrbbecSDK 2.8.6
orbbecGeminiSerial=
orbbecGeminiDeviceIndex=0
orbbecGeminiDepthWidth=640
orbbecGeminiDepthHeight=480
orbbecGeminiFps=15
orbbecGeminiCaptureTimeoutMs=5000
orbbecGeminiWarmupFrameCount=5
orbbecGeminiSaveCaptureToDisk=true
orbbecGeminiCaptureCacheDir=
orbbecGeminiEnableColorStream=false
; 设备 Ready 后自动采一帧并落盘；默认关闭，联调时改为 true
orbbecGeminiCaptureOnStart=false

[LivoxMid360]
livoxMid360Enabled=false
livoxMid360SdkRoot=third_party/Livox-SDK2
livoxMid360ConfigFile=bin/mid360_config.json
livoxMid360Serial=47MCNCN0035510
livoxMid360DiscoveryTimeoutMs=10000

[TfminiPlus]
; 吊装/内壁防碰辅助测距。现场双 TF 各接一个 USB 转串口，对应两个 COM 口。
; 联调：tfminiPlusEnabled=true，填实际 COM（设备管理器查看），tfminiPlusLogFrames=true 打印测距。
tfminiPlusEnabled=false
tfminiPlusPort=COM3
tfminiPlusPort2=COM4
tfminiPlusBaudRate=115200
; 预留阈值：本阶段仅日志输出，不写 Modbus IPC_SafetyAction_Word。
collisionThresholdMm=0
; 是否打印每帧测距数据（dist/strength/reliable）。关闭：改为 false 并重启程序。
tfminiPlusLogFrames=false

[Hmi]
enabled=true
tcpPort=9900
